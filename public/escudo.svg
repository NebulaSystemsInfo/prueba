  <path d="M22 64 H178 V140 C178 196 140 226 100 244 C60 226 22 196 22 140 Z" fill="url(#oro)" stroke="#6b4f17" stroke-width="1.5"/>
  <path d="M30 72 H170 V140 C170 190 136 217 100 234 C64 217 30 190 30 140 Z" fill="#fdfaf2"/>
  <path d="M36 78 H164 V140 C164 186 132 211 100 227 C68 211 36 186 36 140 Z" fill="url(#verde)"/>
