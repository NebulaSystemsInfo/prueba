  <rect x="88" y="90" width="24" height="10" rx="1.5" fill="#fdfaf2"/>
  <text x="100" y="98" font-family="Georgia, serif" font-size="7.5" font-weight="700" text-anchor="middle" fill="#7e0f18">INRI</text>
