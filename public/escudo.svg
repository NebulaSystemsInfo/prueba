    <line x1="100" y1="120" x2="44" y2="140"/><line x1="100" y1="120" x2="156" y2="140"/>
    <line x1="100" y1="120" x2="58" y2="182"/><line x1="100" y1="120" x2="142" y2="182"/>
  </g>
