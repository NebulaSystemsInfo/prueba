<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 250" role="img" aria-label="Escudo de la Hermandad del Santísimo Cristo de la Sangre de Pedrera">
  <defs>
    <linearGradient id="oro" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f1d98a"/>
      <stop offset=".5" stop-color="#c9a24a"/>
      <stop offset="1" stop-color="#8f6d24"/>
    </linearGradient>
    <linearGradient id="verde" x1="0" y1="0" x2="0" y2="1">
