      <stop offset="1" stop-color="#7e0f18"/>
    </linearGradient>
  </defs>
  <!-- Corona -->
  <g fill="url(#oro)" stroke="#6b4f17" stroke-width="1.5" stroke-linejoin="round">
    <path d="M52 52 L46 22 L70 38 L84 14 L100 34 L116 14 L130 38 L154 22 L148 52 Z"/>
    <rect x="50" y="50" width="100" height="10" rx="3"/>
    <circle cx="46" cy="20" r="4"/><circle cx="84" cy="12" r="4"/>
    <circle cx="116" cy="12" r="4"/><circle cx="154" cy="20" r="4"/>
    <path d="M96 12 h8 v-4 h4 v-4 h-4 v-4 h-8 v4 h-4 v4 h4 z" transform="translate(0,20)"/>
  </g>
  <circle cx="75" cy="55" r="2.5" fill="#9b111e"/><circle cx="100" cy="55" r="2.5" fill="#1b5a3f"/><circle cx="125" cy="55" r="2.5" fill="#9b111e"/>
